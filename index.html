<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="なっちゃんMAP">
<title>なっちゃんMAP</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}#map{height:100vh}
.top{position:fixed;z-index:1000;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:7px}
.search{flex:1;background:#fff;border:0;border-radius:15px;padding:12px 14px;font-size:16px;box-shadow:0 2px 12px #0002}.btn,.chip{border:0;background:#fff;border-radius:15px;padding:11px 12px;font-weight:700;box-shadow:0 2px 12px #0002}
.filters{position:fixed;z-index:1000;top:65px;left:10px;right:10px;display:flex;gap:6px;overflow:auto}.chip{white-space:nowrap;padding:8px 11px}
.results{position:fixed;z-index:1500;top:108px;left:10px;right:10px;background:#fff;border-radius:16px;box-shadow:0 4px 20px #0003;max-height:48vh;overflow:auto}.result{padding:13px;border-bottom:1px solid #eee}.result b{display:block}.result small{color:#666}
.add{position:fixed;z-index:1000;right:18px;bottom:28px;width:58px;height:58px;border:0;border-radius:50%;font-size:32px;color:#fff;background:#222}.legend{position:fixed;z-index:1000;left:10px;bottom:22px;background:#fff;border-radius:14px;padding:8px 10px;font-size:11px;box-shadow:0 2px 10px #0002}
.panel{position:fixed;z-index:2000;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -4px 24px #0002;max-height:82vh;overflow:auto}.hidden{display:none}
.row{display:flex;gap:8px}.row>*{flex:1}h2{margin:0 0 14px}label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}input,select,textarea{width:100%;border:1px solid #ddd;border-radius:12px;padding:12px;font-size:16px}textarea{min-height:80px}.primary,.secondary{width:100%;border:0;border-radius:13px;padding:13px;font-size:16px;font-weight:700;margin-top:14px}.primary{background:#222;color:#fff}.secondary{background:#eee}.close{float:right;border:0;background:#eee;border-radius:50%;width:34px;height:34px;font-size:20px}.marker{font-size:24px;text-shadow:0 1px 2px #0005}
</style></head><body>
<div id="map"></div>
<div class="top"><input id="search" class="search" placeholder="🔍 店名・喫茶店・居酒屋" onkeydown="if(event.key==='Enter')searchPlaces()"><button class="btn" onclick="searchPlaces()">検索</button></div>
<div class="filters"><button class="chip" onclick="setFilter('all')">すべて</button><button class="chip" onclick="setFilter('cafe')">☕️ 喫茶</button><button class="chip" onclick="setFilter('izakaya')">🍺 居酒屋</button><button class="chip" onclick="setFilter('smoking')">🚬 喫煙可</button><button class="chip" onclick="setFilter('visited')">🟢 行った</button><button class="chip" onclick="setFilter('want')">🟡 行きたい</button></div>
<div id="results" class="results hidden"></div><div class="legend">☕️喫茶　🍺居酒屋　🚬喫煙可<br>🚭禁煙　❓不明</div><button class="add" onclick="startAdd()">＋</button>
<div id="formPanel" class="panel hidden"><button class="close" onclick="closePanel()">×</button><h2>お店を登録</h2>
<label>店名</label><input id="name" placeholder="例：喫茶○○"><div class="row"><div><label>種類</label><select id="type"><option value="cafe">☕️ 喫茶店</option><option value="izakaya">🍺 居酒屋</option></select></div><div><label>喫煙</label><select id="smoke"><option value="yes">🚬 喫煙可</option><option value="no">🚭 禁煙</option><option value="unknown">❓ 不明</option></select></div></div>
<label>ステータス</label><select id="status"><option value="visited">🟢 行った</option><option value="want">🟡 行ってみたい</option></select><label>メモ</label><textarea id="memo" placeholder="食べたもの、雰囲気など"></textarea><button class="primary" onclick="savePlace()">保存する</button></div>
<div id="detailPanel" class="panel hidden"><button class="close" onclick="closePanel()">×</button><div id="detail"></div><button class="secondary" onclick="deletePlace()">この店を削除</button></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const KEY="nacchan_map_places_v2";let places=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem("nacchan_map_places_v1")||"[]"),markers=[],searchMarkers=[],adding=false,pending=null,selected=null,filter="all";
const map=L.map("map").setView([34.69,135.19],11);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap contributors"}).addTo(map);L.control.zoom({position:"bottomright"}).addTo(map);
function icon(p){return L.divIcon({className:"marker",html:(p.type==="cafe"?"☕️":"🍺")+(p.smoke==="yes"?"🚬":p.smoke==="no"?"🚭":"❓"),iconSize:[45,38],iconAnchor:[22,19]})}
function renderMarkers(){markers.forEach(m=>map.removeLayer(m));markers=[];places.filter(p=>filter==="all"||(filter==="cafe"||filter==="izakaya"?p.type===filter:filter==="smoking"?p.smoke==="yes":p.status===filter)).forEach(p=>{let m=L.marker([p.lat,p.lng],{icon:icon(p)}).addTo(map);m.bindPopup("<b>"+esc(p.name)+"</b><br>"+(p.type==="cafe"?"☕️ 喫茶店":"🍺 居酒屋")+"　"+(p.smoke==="yes"?"🚬 喫煙可":p.smoke==="no"?"🚭 禁煙":"❓ 不明")+"<br>"+(p.status==="visited"?"🟢 行った":"🟡 行きたい")+"<br><button onclick="showDetail('"+p.id+"')">詳細を見る</button>");markers.push(m)})}
function setFilter(f){filter=f;renderMarkers()}function startAdd(){adding=true;closePanel();alert("登録したい場所を地図上でタップしてください")}
map.on("click",e=>{if(adding){adding=false;openForm(e.latlng.lat,e.latlng.lng,"")}})
function openForm(lat,lng,name){pending={lat,lng};document.getElementById("name").value=name||"";document.getElementById("memo").value="";document.getElementById("smoke").value="unknown";document.getElementById("status").value="want";document.getElementById("type").value=name&&/居酒屋|酒場|バル|焼鳥|焼き鳥/.test(name)?"izakaya":"cafe";document.getElementById("results").classList.add("hidden");document.getElementById("formPanel").classList.remove("hidden")}
function savePlace(){let name=document.getElementById("name").value.trim();if(!name){alert("店名を入力してね");return}places.push({id:Date.now().toString(),name,lat:pending.lat,lng:pending.lng,type:document.getElementById("type").value,smoke:document.getElementById("smoke").value,status:document.getElementById("status").value,memo:document.getElementById("memo").value});localStorage.setItem(KEY,JSON.stringify(places));closePanel();renderMarkers()}
async function searchPlaces(){let q=document.getElementById("search").value.trim();if(!q)return;let r=document.getElementById("results");r.classList.remove("hidden");r.innerHTML="<div class='result'>検索中…</div>";try{let res=await fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=12&accept-language=ja&q="+encodeURIComponent(q));let data=await res.json();window._searchData=data;searchMarkers.forEach(m=>map.removeLayer(m));searchMarkers=[];if(!data.length){r.innerHTML="<div class='result'>見つかりませんでした</div>";return}r.innerHTML=data.map((x,i)=>"<div class='result' onclick='pickSearch("+i+")'><b>"+esc(x.display_name.split(",")[0])+"</b><small>"+esc(x.display_name)+"</small></div>").join("")}catch(e){r.innerHTML="<div class='result'>検索できませんでした。通信状態を確認してね。</div>"}}
function pickSearch(i){let x=window._searchData[i],lat=+x.lat,lng=+x.lon,name=x.display_name.split(",")[0];searchMarkers.forEach(m=>map.removeLayer(m));let m=L.marker([lat,lng]).addTo(map).bindPopup("<b>"+esc(name)+"</b><br><button onclick="openForm("+lat+","+lng+",'"+js(name)+"')">＋ 自分のマップに登録</button>").openPopup();searchMarkers.push(m);map.setView([lat,lng],17);document.getElementById("results").classList.add("hidden")}
function showDetail(id){selected=places.find(p=>p.id===id);if(!selected)return;let p=selected;document.getElementById("detail").innerHTML="<h2>"+esc(p.name)+"</h2><p>"+(p.type==="cafe"?"☕️ 喫茶店":"🍺 居酒屋")+"<br>"+(p.smoke==="yes"?"🚬 喫煙可":p.smoke==="no"?"🚭 禁煙":"❓ 喫煙情報不明")+"<br>"+(p.status==="visited"?"🟢 行った":"🟡 行きたい")+"</p><p>"+esc(p.memo||"メモなし")+"</p>";document.getElementById("detailPanel").classList.remove("hidden")}
function deletePlace(){if(selected&&confirm("この店を削除する？")){places=places.filter(p=>p.id!==selected.id);localStorage.setItem(KEY,JSON.stringify(places));closePanel();renderMarkers()}}
function closePanel(){document.querySelectorAll(".panel").forEach(x=>x.classList.add("hidden"));pending=null}function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function js(s){return String(s).replace(/\/g,"\\").replace(/'/g,"\'")}renderMarkers();
</script></body></html>
