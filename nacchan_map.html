<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="なっちゃんMAP">
<title>なっちゃんMAP</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;background:#f7f7f7;color:#222}
#map{height:100vh;width:100vw}
.top{position:fixed;z-index:1000;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:8px}
.btn{border:0;background:#fff;border-radius:14px;padding:11px 13px;font-size:14px;font-weight:600;box-shadow:0 2px 12px #0002}
#filter{flex:1}
.add{position:fixed;z-index:1000;right:18px;bottom:28px;width:58px;height:58px;border:0;border-radius:50%;font-size:32px;color:#fff;background:#222;box-shadow:0 4px 16px #0004}
.panel{position:fixed;z-index:2000;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -4px 24px #0002;max-height:82vh;overflow:auto}
.hidden{display:none}.row{display:flex;gap:8px}.row>*{flex:1}
h2{margin:0 0 14px;font-size:21px} label{display:block;font-size:13px;font-weight:600;margin:12px 0 6px}
input,select,textarea{width:100%;border:1px solid #ddd;border-radius:12px;padding:12px;font-size:16px;background:#fff}textarea{min-height:80px;resize:vertical}
.primary,.secondary{width:100%;border:0;border-radius:13px;padding:13px;font-size:16px;font-weight:700;margin-top:14px}.primary{background:#222;color:#fff}.secondary{background:#eee}
.close{float:right;border:0;background:#eee;border-radius:50%;width:34px;height:34px;font-size:20px}
.legend{position:fixed;z-index:1000;left:12px;bottom:22px;background:#fff;border-radius:14px;padding:9px 11px;font-size:12px;box-shadow:0 2px 12px #0002;line-height:1.8}
.marker{font-size:25px;text-shadow:0 1px 2px #0005}
.small{font-size:12px;color:#777;margin-top:8px}
.leaflet-popup-content{font-size:14px}
</style>
</head>
<body>
<div id="map"></div>
<div class="top">
  <select id="filter" class="btn" onchange="renderMarkers()">
    <option value="all">すべて表示</option>
    <option value="cafe">☕️ 喫茶店</option>
    <option value="izakaya">🍺 居酒屋</option>
    <option value="smoking">🚬 喫煙可</option>
    <option value="visited">🟢 行った</option>
    <option value="want">🟡 行ってみたい</option>
  </select>
  <button class="btn" onclick="locate()">📍現在地</button>
</div>
<div class="legend">☕️ 喫茶　🍺 居酒屋　🚬 喫煙可<br>🚭 禁煙　❓ 不明</div>
<button class="add" onclick="startAdd()">＋</button>

<div id="formPanel" class="panel hidden">
  <button class="close" onclick="closePanel()">×</button>
  <h2>お店を登録</h2>
  <div class="small">地図上をタップした場所が登録地点になります。</div>
  <label>店名</label><input id="name" placeholder="例：喫茶○○">
  <div class="row">
    <div><label>種類</label><select id="type"><option value="cafe">☕️ 喫茶店</option><option value="izakaya">🍺 居酒屋</option></select></div>
    <div><label>喫煙</label><select id="smoke"><option value="yes">🚬 喫煙可</option><option value="no">🚭 禁煙</option><option value="unknown">❓ 不明</option></select></div>
  </div>
  <label>ステータス</label><select id="status"><option value="visited">🟢 行った</option><option value="want">🟡 行ってみたい</option></select>
  <label>メモ</label><textarea id="memo" placeholder="食べたもの、雰囲気、また行きたい理由など"></textarea>
  <button class="primary" onclick="savePlace()">保存する</button>
</div>

<div id="detailPanel" class="panel hidden">
  <button class="close" onclick="closePanel()">×</button>
  <div id="detail"></div>
  <button class="secondary" onclick="deletePlace()">この店を削除</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const KEY="nacchan_map_places_v1";
let places=JSON.parse(localStorage.getItem(KEY)||"[]"), markers=[], adding=false, pending=null, selected=null;

const map=L.map("map",{zoomControl:false}).setView([34.69,135.19],11);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap contributors"}).addTo(map);
L.control.zoom({position:"bottomright"}).addTo(map);

function icon(p){
  let base=p.type==="cafe"?"☕️":"🍺";
  let smoke=p.smoke==="yes"?"🚬":p.smoke==="no"?"🚭":"❓";
  return L.divIcon({className:"marker",html:`<span>${base}</span><span style="font-size:16px">${smoke}</span>`,iconSize:[46,40],iconAnchor:[23,20],popupAnchor:[0,-18]});
}
function renderMarkers(){
  markers.forEach(m=>map.removeLayer(m)); markers=[];
  const f=document.getElementById("filter").value;
  places.filter(p=>{
    if(f==="all")return true;if(f==="cafe"||f==="izakaya")return p.type===f;
    if(f==="smoking")return p.smoke==="yes";return p.status===f;
  }).forEach(p=>{
    const m=L.marker([p.lat,p.lng],{icon:icon(p)}).addTo(map);
    m.bindPopup(`<b>${esc(p.name)}</b><br>${p.type==="cafe"?"☕️ 喫茶店":"🍺 居酒屋"}　${p.smoke==="yes"?"🚬 喫煙可":p.smoke==="no"?"🚭 禁煙":"❓ 不明"}<br>${p.status==="visited"?"🟢 行った":"🟡 行ってみたい"}<br><button onclick="showDetail('${p.id}')">詳細を見る</button>`);
    markers.push(m);
  });
}
function startAdd(){
  adding=true; closePanel(); alert("登録したい場所を地図上でタップしてください。");
}
map.on("click",e=>{
  if(!adding)return;
  adding=false; pending={lat:e.latlng.lat,lng:e.latlng.lng};
  ["name","memo"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("type").value="cafe";document.getElementById("smoke").value="yes";document.getElementById("status").value="want";
  document.getElementById("formPanel").classList.remove("hidden");
});
function savePlace(){
  const name=document.getElementById("name").value.trim();
  if(!name){alert("店名を入力してね");return}
  places.push({id:Date.now().toString(),name,lat:pending.lat,lng:pending.lng,type:document.getElementById("type").value,smoke:document.getElementById("smoke").value,status:document.getElementById("status").value,memo:document.getElementById("memo").value});
  localStorage.setItem(KEY,JSON.stringify(places));closePanel();renderMarkers();
}
function showDetail(id){
  selected=places.find(p=>p.id===id); if(!selected)return;
  const p=selected;
  document.getElementById("detail").innerHTML=`<h2>${esc(p.name)}</h2><p>${p.type==="cafe"?"☕️ 喫茶店":"🍺 居酒屋"}<br>${p.smoke==="yes"?"🚬 喫煙可":p.smoke==="no"?"🚭 禁煙":"❓ 喫煙情報不明"}<br>${p.status==="visited"?"🟢 行った":"🟡 行ってみたい"}</p><p>${esc(p.memo||"メモなし")}</p>`;
  document.getElementById("detailPanel").classList.remove("hidden");
}
function deletePlace(){
  if(!selected)return;
  if(confirm("この店を削除する？")){places=places.filter(p=>p.id!==selected.id);localStorage.setItem(KEY,JSON.stringify(places));closePanel();renderMarkers();}
}
function closePanel(){document.querySelectorAll(".panel").forEach(x=>x.classList.add("hidden"));pending=null}
function locate(){
  if(!navigator.geolocation){alert("現在地を取得できません");return}
  navigator.geolocation.getCurrentPosition(pos=>map.setView([pos.coords.latitude,pos.coords.longitude],16),()=>alert("位置情報の使用を許可してね"));
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
renderMarkers();
</script>
</body>
</html>
